plugins {
    id 'com.android.application'
}

android {
    namespace 'com.royalworld.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.royalworld.app"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "4.0"
    }

    signingConfigs {
        release {
            def ksFile = file("royalworld-release.jks")
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: "royalworld123"
                keyAlias System.getenv("KEY_ALIAS") ?: "royalworld"
                keyPassword System.getenv("KEY_PASSWORD") ?: "royalworld123"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (file("royalworld-release.jks").exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22"))
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.firebase:firebase-messaging:23.4.1'
}

if (file("google-services.json").exists()) {
    apply plugin: 'com.google.gms.google-services'
}
